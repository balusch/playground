[configure-debug]
command=cmake --preset debug -S .
cwd=<root>
output=terminal
pos=bottom
save=2

[build-current]
command=sh -lc 'FILE="$(VIM_FILEPATH)"; ROOT="$(VIM_ROOT)"; REL="${FILE#"$ROOT"/}"; case "$REL" in topics/*/eg*.cc) GROUP="$(basename "$(dirname "$REL")")"; STEM="$(basename "$REL" .cc)"; TARGET="${GROUP}_${STEM}" ;; demos/*/*/*.cc) TARGET="$(basename "$REL" .cc)" ;; tests/*.cc) TARGET="$(basename "$REL" .cc)" ;; benchmarks/*.cc) TARGET="$(basename "$REL" .cc)" ;; *) echo "ERROR: unsupported file: $REL"; exit 1 ;; esac; cmake --preset debug -S . && cmake --build --preset debug --target "$TARGET"'
cwd=<root>
output=quickfix
errorformat=%f:%l:%c: %trror: %m,%f:%l:%c: %tarning: %m
save=2

[run-current]
command=sh -lc 'FILE="$(VIM_FILEPATH)"; ROOT="$(VIM_ROOT)"; REL="${FILE#"$ROOT"/}"; case "$REL" in topics/*/eg*.cc) GROUP="$(basename "$(dirname "$REL")")"; STEM="$(basename "$REL" .cc)"; TARGET="${GROUP}_${STEM}"; EXE="build/debug/topics/${GROUP}/${TARGET}" ;; demos/*/*/*.cc) TARGET="$(basename "$REL" .cc)"; EXE="build/debug/$(dirname "$REL")/${TARGET}" ;; tests/*.cc) TARGET="$(basename "$REL" .cc)"; EXE="build/debug/tests/${TARGET}" ;; benchmarks/*.cc) TARGET="$(basename "$REL" .cc)"; EXE="build/debug/benchmarks/${TARGET}" ;; *) echo "ERROR: unsupported file: $REL"; exit 1 ;; esac; cmake --preset debug -S . && cmake --build --preset debug --target "$TARGET" && "./${EXE}"'
cwd=<root>
output=terminal
pos=bottom
save=2

[test-current]
command=sh -lc 'FILE="$(VIM_FILEPATH)"; ROOT="$(VIM_ROOT)"; REL="${FILE#"$ROOT"/}"; case "$REL" in tests/*.cc) TARGET="$(basename "$REL" .cc)"; cmake --preset debug -S . && cmake --build --preset debug --target "$TARGET" && ctest --test-dir build/debug --output-on-failure -R "^${TARGET}$" ;; *) cmake --preset debug -S . && ctest --preset debug --output-on-failure ;; esac'
cwd=<root>
output=terminal
pos=bottom
save=2

[c-build-debug]
command=cmake --preset debug -S . && cmake --build --preset debug
cwd=<root>
output=quickfix
errorformat=%f:%l:%c: %trror: %m,%f:%l:%c: %tarning: %m
save=2

